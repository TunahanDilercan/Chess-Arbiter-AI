# Alembic configuration for Arbiter AI backend.
# Run from the backend/ directory:
#   alembic upgrade head       — apply all migrations
#   alembic revision --autogenerate -m "description"  — generate new migration

[alembic]
script_location = alembic
prepend_sys_path = .

# DATABASE_URL is read from environment / .env via config.py
# Override here only if you need a non-env URL for migration runs:
# sqlalchemy.url = postgresql+asyncpg://arbiter:arbiter@localhost/arbiter

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
