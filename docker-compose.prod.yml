# Arbiter AI — production stack (internet-facing)
#
# Start:  docker compose -f docker-compose.prod.yml up -d --build
# Reads secrets from a .env file next to this compose file:
#   POSTGRES_PASSWORD=<strong password>
#   ANTHROPIC_API_KEY=sk-ant-...
#   CORS_ORIGINS=["https://app.example.com"]
#
# TLS certificates: place fullchain.pem + privkey.pem under ./deploy/certs
# (e.g. from certbot). See docs/DEPLOYMENT.md.

services:

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8000"            # internal only — nginx is the public entry point
    environment:
      DATABASE_URL: "postgresql+asyncpg://arbiter:${POSTGRES_PASSWORD}@postgres:5432/arbiter"
      REDIS_URL: "redis://redis:6379/0"
      STORAGE_BACKEND: "local"
      LOCAL_STORAGE_PATH: "/app/storage"
      AUTO_CREATE_TABLES: "false"          # schema is managed by Alembic
      DEBUG: "false"
      CORS_ORIGINS: "${CORS_ORIGINS:-[]}"
      OCR_BACKEND: "${OCR_BACKEND:-claude}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY}"
      RATE_LIMIT_ENABLED: "true"
      TRUST_PROXY_HEADERS: "true"          # nginx overwrites X-Forwarded-For
      ENABLE_HSTS: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - arbiter_storage:/app/storage

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: alembic upgrade head
    environment:
      DATABASE_URL: "postgresql+asyncpg://arbiter:${POSTGRES_PASSWORD}@postgres:5432/arbiter"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql+asyncpg://arbiter:${POSTGRES_PASSWORD}@postgres:5432/arbiter"
      REDIS_URL: "redis://redis:6379/0"
      STORAGE_BACKEND: "local"
      LOCAL_STORAGE_PATH: "/app/storage"
      AUTO_CREATE_TABLES: "false"
      DEBUG: "false"
      OCR_BACKEND: "${OCR_BACKEND:-claude}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - arbiter_storage:/app/storage
    command: celery -A workers.celery_app worker --loglevel=info --queues=arbiter --concurrency=2

  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: arbiter
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: arbiter
    # No host port mapping — DB is reachable only from the compose network.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arbiter"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # No host port mapping — internal only.
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
  arbiter_storage:
