# Arbiter AI — local development stack
# Start: docker-compose up
# Backend API: http://localhost:8000
# Docs:        http://localhost:8000/docs

services:

  # ── Backend (FastAPI) ──────────────────────────────────────────────────────
  backend:
    image: arbiter-ai-app:local
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: "postgresql+asyncpg://arbiter:arbiter@postgres:5432/arbiter"
      REDIS_URL: "redis://redis:6379/0"
      STORAGE_BACKEND: "local"
      LOCAL_STORAGE_PATH: "/app/storage"
      AUTO_CREATE_TABLES: "false"
      DEBUG: "true"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./backend:/app                       # hot-reload in dev
      - arbiter_storage:/app/storage         # persisted uploaded files
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  migrate:
    image: arbiter-ai-app:local
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: "postgresql+asyncpg://arbiter:arbiter@postgres:5432/arbiter"
      AUTO_CREATE_TABLES: "false"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
    command: alembic upgrade head
    restart: "no"

  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: arbiter
      POSTGRES_PASSWORD: arbiter
      POSTGRES_DB: arbiter
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arbiter"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Redis (Phase 4+: Celery broker) ───────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data

  # ── Celery worker ─────────────────────────────────────────────────────────
  worker:
    image: arbiter-ai-app:local
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: "postgresql+asyncpg://arbiter:arbiter@postgres:5432/arbiter"
      REDIS_URL: "redis://redis:6379/0"
      STORAGE_BACKEND: "local"
      LOCAL_STORAGE_PATH: "/app/storage"
      AUTO_CREATE_TABLES: "false"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./backend:/app
      - arbiter_storage:/app/storage
    command: celery -A workers.celery_app worker --loglevel=info --queues=arbiter --concurrency=2

volumes:
  postgres_data:
  redis_data:
  arbiter_storage:
