# Android build for Google Play (com.hanova.chessarbiter).
#
# - Every push touching mobile/: analyze + tests + a release AAB (signed with
#   the upload key when the secrets exist, otherwise debug-signed for checking
#   only — such a bundle cannot be uploaded to Play).
# - Manual run (Actions → Android → Run workflow): store build. Fails unless the
#   upload key and RevenueCat key are configured; optionally uploads the AAB to a
#   Play track as a draft.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64   base64 of upload-keystore.jks (tool/create_upload_keystore.sh)
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS         usually "upload"
#   ANDROID_KEY_PASSWORD
#   REVENUECAT_ANDROID_KEY    public SDK key "goog_…" (without it the app is the free edition)
#   PLAY_SERVICE_ACCOUNT_JSON optional: Play Console API service account for uploads
# Repository variables (optional): PRIVACY_URL, SUPPORT_URL, TERMS_URL
name: Android

on:
  push:
    branches: [main, 'claude/**']
    paths: ['mobile/**', '.github/workflows/android.yml']
  workflow_dispatch:
    inputs:
      track:
        description: 'Upload to Play track (none = only build the AAB)'
        type: choice
        options: [none, internal, alpha]
        default: none

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    env:
      STORE_BUILD: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Tests (fast suite)
        run: flutter test

      - name: Upload key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "No upload key configured: bundle will be debug-signed (not uploadable)."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
          cat > android/key.properties <<EOF
          storeFile=$RUNNER_TEMP/upload-keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          echo "SIGNED=true" >> "$GITHUB_ENV"

      - name: Store build preconditions
        if: env.STORE_BUILD == 'true'
        env:
          RC_KEY: ${{ secrets.REVENUECAT_ANDROID_KEY }}
        run: |
          [ "$SIGNED" = "true" ] || { echo "::error::Upload key secrets are missing"; exit 1; }
          [ -n "$RC_KEY" ] || { echo "::error::REVENUECAT_ANDROID_KEY is missing (the build would be the free edition)"; exit 1; }

      - name: Build AAB
        env:
          REQUIRE_RELEASE_SIGNING: ${{ env.STORE_BUILD }}
          RC_KEY: ${{ secrets.REVENUECAT_ANDROID_KEY }}
          PRIVACY_URL: ${{ vars.PRIVACY_URL }}
          SUPPORT_URL: ${{ vars.SUPPORT_URL }}
          TERMS_URL: ${{ vars.TERMS_URL }}
        run: |
          DEFINES=()
          [ -n "$RC_KEY" ] && DEFINES+=(--dart-define=REVENUECAT_ANDROID_KEY="$RC_KEY")
          [ -n "$PRIVACY_URL" ] && DEFINES+=(--dart-define=PRIVACY_URL="$PRIVACY_URL")
          [ -n "$SUPPORT_URL" ] && DEFINES+=(--dart-define=SUPPORT_URL="$SUPPORT_URL")
          [ -n "$TERMS_URL" ] && DEFINES+=(--dart-define=TERMS_URL="$TERMS_URL")
          # versionCode must grow with every Play upload.
          flutter build appbundle --release \
            --build-number=$((100 + GITHUB_RUN_NUMBER)) \
            --obfuscate --split-debug-info=build/symbols \
            "${DEFINES[@]}"

      - uses: actions/upload-artifact@v4
        with:
          name: hakem-masasi-aab-${{ github.run_number }}${{ env.SIGNED != 'true' && '-debug-signed' || '' }}
          path: |
            mobile/build/app/outputs/bundle/release/app-release.aab
            mobile/build/app/outputs/mapping/release/mapping.txt
            mobile/build/symbols
          retention-days: 30

      - name: Locate R8 mapping
        if: env.STORE_BUILD == 'true' && inputs.track != 'none'
        run: |
          f=build/app/outputs/mapping/release/mapping.txt
          [ -f "$f" ] && echo "MAPPING_FILE=mobile/$f" >> "$GITHUB_ENV" || true

      - name: Upload to Google Play
        if: env.STORE_BUILD == 'true' && inputs.track != 'none'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.hanova.chessarbiter
          releaseFiles: mobile/build/app/outputs/bundle/release/app-release.aab
          track: ${{ inputs.track }}
          status: draft
          whatsNewDirectory: mobile/store/android/whatsnew
          mappingFile: ${{ env.MAPPING_FILE }}
